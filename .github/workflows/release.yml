# Publishes a GitHub release for the version in extension/manifest.json:
# runs the tests, zips the extension, and attaches the zip.
#
# Runs automatically when the extension changes on main. It skips versions that already
# have a release, so bumping "version" in manifest.json is all it takes to ship a new one.
# It can also be started by hand (Actions → Release → Run workflow), or by pushing a v* tag.
# Release notes come from .github/releases/v<version>.md when that file exists.
name: Release

on:
  push:
    branches: [main]
    paths: ['extension/**', '.github/releases/**', '.github/workflows/release.yml']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        run: |
          VERSION=$(node -p "require('./extension/manifest.json').version")
          TAG=v$VERSION
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $VERSION"; exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists – nothing to do."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        if: env.SKIP != '1'
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        if: env.SKIP != '1'
        with:
          python-version: '3.12'

      - name: Install test tools
        if: env.SKIP != '1'
        run: |
          npm install
          pip install numpy playwright

      - name: Offline test (real models in Node)
        if: env.SKIP != '1'
        run: npm run test:audio && npm run test:sim

      - name: Live test (real extension in Chrome)
        if: env.SKIP != '1'
        run: CHROME=$(command -v google-chrome) npm run test:chrome

      - name: Build zip
        if: env.SKIP != '1'
        run: |
          NAME=action-volume-tamer-$VERSION
          mkdir -p dist/$NAME
          cp -r extension/. dist/$NAME/
          cp LICENSE THIRD_PARTY_NOTICES.md dist/$NAME/
          (cd dist && zip -qr $NAME.zip $NAME)
          echo "ZIP=dist/$NAME.zip" >> "$GITHUB_ENV"
          echo "SHA=$(sha256sum dist/$NAME.zip | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Publish release
        if: env.SKIP != '1'
        run: |
          NOTES=.github/releases/$TAG.md
          if [ -f "$NOTES" ]; then cp "$NOTES" notes.md; else echo "Action Volume Tamer $VERSION" > notes.md; fi
          printf '\nSHA-256 of the zip: `%s`\n' "$SHA" >> notes.md
          gh release create "$TAG" "$ZIP" --target "$GITHUB_SHA" \
            --title "Action Volume Tamer $VERSION" --notes-file notes.md --latest
